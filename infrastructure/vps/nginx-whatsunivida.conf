# Exemplo de site do nginx NO HOST da VPS (fora do Docker) que publica o
# WhatsUnivida em https://whatsunivida.sauberlich.com.br e repassa para o
# container web, que escuta na porta 8085 (ver docker-compose.yml).
#
# Passos (Ubuntu):
#   1. DNS: crie um registro A  whatsunivida.sauberlich.com.br -> IP da VPS
#   2. sudo cp nginx-whatsunivida.conf /etc/nginx/sites-available/whatsunivida
#      sudo ln -s /etc/nginx/sites-available/whatsunivida /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d whatsunivida.sauberlich.com.br
#      (o certbot completa o bloco HTTPS/redirecionamento sozinho)
#   5. No .env da VPS: WEB_APP_URL=https://whatsunivida.sauberlich.com.br
#      (o login usa cookie "Secure": so funciona via https://)
#
# Se ja existe outro site no mesmo nginx (ex.: o WhatsAtendende na 8080),
# basta ter um server_name diferente — os dois convivem.

server {
    listen 80;
    server_name whatsunivida.sauberlich.com.br;

    client_max_body_size 30m;   # anexos de ate 25 MB

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (Socket.IO — tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
