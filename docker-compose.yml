services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsatendende
      POSTGRES_PASSWORD: whatsatendende
      POSTGRES_DB: whatsatendende
    # No host port published: only the api container needs to reach this
    # (over the compose network, by service name — see DATABASE_URL below),
    # and this stack is meant to run on a public VPS where exposing Postgres
    # to the internet would be a real, needless risk. For a local psql
    # session use `docker compose exec postgres psql -U whatsatendende`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsatendende"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same reasoning as postgres above — internal-only.
    volumes:
      - redis_data:/data

  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    # Same reasoning as postgres/redis above — internal-only, no host port.
    # Stateless (no volume needed). The api service calls it over the
    # compose network via LANGUAGETOOL_URL below; a Composer correction
    # suggestion is best-effort, so the api already tolerates this service
    # being slow or down (see writing-assist.service.ts).

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://whatsatendende:whatsatendende@postgres:5432/whatsatendende
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a random secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a random secret in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set a random secret in .env}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      WHATSAPP_AUTH_DIR: /data/whatsapp-sessions
      # Left "silent" (the default) normally — Baileys logs every raw
      # protocol frame at debug level, far too noisy to run permanently.
      # Set WHATSAPP_LOG_LEVEL=warn in .env and redeploy to temporarily
      # surface actual Signal-protocol/session errors (e.g. decryption
      # failures) that never reach this app's own logs at all, since they
      # happen entirely inside Baileys — needed to diagnose anything at the
      # WhatsApp-protocol level instead of guessing from the outside.
      WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-silent}
      WEB_APP_URL: ${WEB_APP_URL:-https://whatsunivida.sauberlich.com.br}
      LANGUAGETOOL_URL: http://languagetool:8010
      UPLOAD_DIR: /data/uploads
      # Largest single file an agent can attach in Atendimento (video, photo,
      # PDF, audio) — the API answers "Arquivo muito grande" above it. Set
      # UPLOAD_MAX_SIZE_MB in .env to change it; nginx.conf lets up to 300 MB
      # through to the API, so keep it at or below that. The whole file is
      # held in memory while it is sent, so a small VPS wants this modest.
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-25}
    volumes:
      - api_uploads:/data/uploads
      - whatsapp_sessions:/data/whatsapp-sessions
    # No host port published: the web container's nginx already proxies
    # /api, /uploads and /socket.io to this service internally (see
    # infrastructure/docker/nginx.conf) — the browser never needs to reach
    # it directly, so it stays off the public internet. If you need to
    # reach it directly for debugging, use `docker compose exec api sh` or
    # temporarily add back `ports: ["127.0.0.1:4000:4000"]` (loopback-only)
    # and an SSH tunnel, rather than publishing it to 0.0.0.0.

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8085:80"
    volumes:
      # Holds the installable Android app (.apk) — see nginx.conf's
      # /downloads/ location. A named volume, not part of the image build,
      # so uploading the file once (see infrastructure/vps/README.md)
      # survives every future `git pull` + rebuild, the same way
      # api_uploads/whatsapp_sessions already do for the api service.
      - app_downloads:/usr/share/nginx/downloads

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  whatsapp_sessions:
  app_downloads:
